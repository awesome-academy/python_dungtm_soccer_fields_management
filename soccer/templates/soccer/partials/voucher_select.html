{% load i18n %}

<div class="mb-3">
  <label for="voucher-select" class="form-label fw-bold">{% trans 'Voucher' %}</label>
  <select name="voucher" class="form-select" id="voucher-select">
    <option value="">
      {% trans 'No voucher' %}
    </option>
    {% for v in vouchers %}
      <option value="{{ v.id }}" 
              data-description="{{ v.description|default:'' }}" 
              data-discount="{{ v.discount_percent }}" 
              data-validfrom="{{ v.valid_from|date:DATE_FORMAT }}" 
              data-validto="{{ v.valid_to|date:DATE_FORMAT }}" 
              data-minprice="{{ v.min_price }}" 
              data-maxdiscount="{{ v.max_discount_amount }}" 
              data-rest="{{ v.rest_quantity }}">
        {{ v.code }} ({{ v.discount_percent }}%)
      </option>
    {% endfor %}
  </select>
  {% if form.voucher.errors %}
    <div class="text-danger small">{{ form.voucher.errors }}</div>
  {% endif %}
  
  <div id="voucher-detail" class="card mt-2 hidden">
    <div class="card-body">
      <div class="row">
        <div class="col-md-6 mb-2">
          <div class="d-flex">
            <div class="text-muted me-2"><i class="bi bi-info-circle"></i></div>
            <div>
              <div class="fw-semibold">{% trans 'Description' %}</div>
              <p id="voucher-description" class="mb-0"></p>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-2">
          <div class="d-flex">
            <div class="text-muted me-2"><i class="bi bi-percent"></i></div>
            <div>
              <div class="fw-semibold">{% trans 'Discount' %}</div>
              <p id="voucher-discount" class="mb-0 text-success fw-bold"></p>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-2">
          <div class="d-flex">
            <div class="text-muted me-2"><i class="bi bi-calendar-range"></i></div>
            <div>
              <div class="fw-semibold">{% trans 'Valid' %}</div>
              <p class="mb-0"><span id="voucher-validfrom"></span> - <span id="voucher-validto"></span></p>
            </div>
          </div>
        </div>
        <div class="col-md-6 mb-2">
          <div class="d-flex">
            <div class="text-muted me-2"><i class="bi bi-tag"></i></div>
            <div>
              <div class="fw-semibold">{% trans 'Requirements' %}</div>
              <p class="mb-0">{% trans 'Min price' %}: <span id="voucher-minprice" class="fw-medium"></span></p>
              <p class="mb-0">{% trans 'Max discount' %}: <span id="voucher-maxdiscount" class="fw-medium"></span></p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="d-flex">
            <div class="text-muted me-2"><i class="bi bi-123"></i></div>
            <div>
              <div class="fw-semibold">{% trans 'Availability' %}</div>
              <p id="voucher-rest" class="mb-0"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
