<!DOCTYPE html>
{% load i18n %}
<html lang="en">
  <head>
    {% block title %}
      <title>{% trans 'Soccer Fields Management' %}</title>
    {% endblock %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>

  <body class="auth-page">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
          <div class="auth-card p-4 p-md-5 position-relative">
            <div class="language-selector-wrapper">
              {% include 'language_selector.html' %}
            </div>
            
            <div class="text-center mb-4">
              <div class="auth-brand-logo mx-auto">
                <i class="bi bi-dribbble"></i>
              </div>
              <h2 class="mb-0">{% trans 'Soccer Fields Management' %}</h2>
              <p class="text-muted">{% block auth_subtitle %}{% endblock %}</p>
            </div>
            
            {% block content %}
            {% endblock %}
            
            <div class="mt-4 text-center">
              {% block auth_footer %}{% endblock %}
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
